name: mobile
description: "Flick — Cross-device P2P clipboard sync app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^17.2.2
  mobile_scanner: ^5.2.0
  clipboard_watcher: ^0.3.0
  peerdart: ^0.5.6
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  web_socket_channel: ^3.0.0
  flutter_rust_bridge: 2.12.0

dependency_overrides:
  flutter_webrtc: ^0.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  ffigen: ^11.0.0

flutter:
  uses-material-design: true
