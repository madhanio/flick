[package]
name = "flick_core"
version = "0.1.0"
edition = "2021"
description = "Flick P2P Clipboard Core Engine (Iroh + Gossip)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
iroh = "0.28"
iroh-gossip = "0.28"
iroh-net = "=0.28.1"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
bytes = "1.6"
tracing = "0.1"
tracing-subscriber = "0.3"
ed25519-dalek = { version = "2.1", features = ["serde"] }
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.8"
chrono = "0.4"
futures-lite = "2.3"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"

[[bin]]
name = "flick_node"
path = "src/main.rs"
