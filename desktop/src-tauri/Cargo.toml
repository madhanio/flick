[package]
name = "flick_desktop"
version = "0.1.0"
description = "Flick Desktop Application"
authors = ["Madhan <madhanio@github>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }
which = "6.0"

[dependencies]
tauri = { version = "2.0.0-rc", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
flick_core = { path = "../../core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
